name: CI and Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: event_manager_test
          MYSQL_USER: event_manager
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://event_manager:test-password@127.0.0.1:3306/event_manager_test
      APP_SECRET_KEY: ci-only-secret-key-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: backend/requirements.txt,
          }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: "22",
            cache: pnpm,
            cache-dependency-path: frontend/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment script and Compose configuration
        shell: bash
        run: |
          bash -n scripts/deploy-backend.sh scripts/test-deploy-backend.sh
          scripts/test-deploy-backend.sh
          docker compose \
            --env-file .env.backend.example \
            -f docker-compose.backend.yml \
            config --quiet
          BACKEND_IMAGE="ghcr.io/example/event-manager-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            docker compose \
              --env-file .env.backend.example \
              -f docker-compose.backend.yml \
              config --quiet

  publish-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, deployment-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image-name
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-backend" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Export immutable image reference
        id: image
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid image digest" >&2
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: publish-backend
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-backend
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "Production SSH secrets are not configured" >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"
      - name: Deploy immutable backend image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_IMAGE: ${{ needs.publish-backend.outputs.image }}
        shell: bash
        run: |
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "DEPLOY_HOST is missing or invalid" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "DEPLOY_USER is missing or invalid" >&2
            exit 1
          fi
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == *$'\n'* ]]; then
            echo "DEPLOY_PATH must be an absolute path without newlines" >&2
            exit 1
          fi

          printf -v remote_command \
            'cd -- %q && bash -s -- %q %q' \
            "$DEPLOY_PATH" "$TARGET_SHA" "$TARGET_IMAGE"

          ssh \
            -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command" \
            < scripts/deploy-backend.sh
